  --board:#506B5B; --focus:#2C6BB0; --warn:#A63A27; --good:#2F6B4C;
  --han1:#FBE596; --han2:#C4E7D6; --han3:#C2DEF3; --han4:#F8C9BA;
  --han5:#E0D3F0; --han6:#DCE9AE; --han7:#F7D5AC; --han8:#CDE6E6;
  --font-hand:"UDG Kana","BIZ UDGothic","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --font-body:"UDG Kana","BIZ UDGothic","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --line:2.5px;
  --wobA:16px 9px 14px 10px/10px 15px 9px 16px;
  --wobB:9px 16px 10px 15px/15px 9px 16px 10px;
  --wobC:13px 11px 17px 8px/9px 17px 10px 14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-weight:400;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.app{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:10px 40px;
  display:flex;flex-direction:column;gap:12px}
h1,h2,h3,p,ul,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0}
ul{list-style:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.doodle{width:96px;height:auto;flex:none;animation:bob 1.8s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
h1{font-family:var(--font-hand);font-weight:700;font-size:clamp(1.5rem,4.6vw,2.3rem);line-height:1.1;
  letter-spacing:.05em;text-wrap:balance}
.topbtns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- buttons ---------- */
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.btn{border:var(--line) solid var(--ink);background:var(--paper);border-radius:var(--wobA);
  padding:.4em .95em;font-weight:700;line-height:1.3;box-shadow:0 3px 0 var(--ink);
  transition:transform .08s,box-shadow .08s}
.btn:nth-of-type(2n){border-radius:var(--wobB)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.sm{font-size:.9rem;padding:.3em .8em}
.btn[aria-pressed="true"]{background:var(--sun)}
.btn.big{font-family:var(--font-hand);font-weight:700;font-size:clamp(1.45rem,4.2vw,2.2rem);
  background:var(--sun);padding:.3em 1.3em;border-width:3px;border-radius:var(--wobC);
  box-shadow:0 6px 0 var(--ink);letter-spacing:.04em}
.btn.big:active{transform:translateY(6px)}
.btn.big.hot{background:var(--coral)}
.btn.danger{color:var(--warn)}

/* ---------- classroom board ---------- */
.board{align-self:center;width:100%;margin-inline:auto;
  max-width:max(300px,calc((100vh - 330px)*2*var(--cols)/var(--rows)));
  display:flex;flex-direction:column;gap:10px}
.board.flip{flex-direction:column-reverse}
.kokuban{font-weight:700;align-self:center;width:min(62%,440px);text-align:center;font-family:var(--font-hand);
  background:var(--board);color:var(--paper);border:var(--line) solid var(--ink);
  border-radius:var(--wobB);letter-spacing:.35em;text-indent:.35em;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(4px,1vw,10px)}
.seat{container-type:inline-size;position:relative;aspect-ratio:2/1;min-width:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--wash);color:var(--ink);border:var(--line) solid var(--ink);border-radius:var(--wobA)}
.seat:nth-child(2n){border-radius:var(--wobB)}
.seat:nth-child(3n){border-radius:var(--wobC)}
.seat.off{visibility:hidden}
.seat .tag{position:absolute;top:4%;left:0;right:0;text-align:center;font-weight:700;line-height:1.2;
  font-size:clamp(8px,9cqw,15px);white-space:nowrap}
.seat .nm{font-family:var(--font-hand);font-weight:700;line-height:1.1;white-space:nowrap;margin-top:9cqw;
  font-size:min(2.3rem,calc(84cqw / var(--len,3)),21cqw)}
.seat.notag .nm{margin-top:0}
.hc1{background:var(--han1)}.hc2{background:var(--han2)}.hc3{background:var(--han3)}.hc4{background:var(--han4)}
.hc5{background:var(--han5)}.hc6{background:var(--han6)}.hc7{background:var(--han7)}.hc8{background:var(--han8)}
@media (max-width:560px){
  .seat{aspect-ratio:5/4;border-width:2px}
  .seat .nm{font-size:min(2.3rem,calc(88cqw / var(--len,3)),28cqw)}
}

.rolling .seat{animation:wig .22s ease-in-out infinite alternate}
.rolling .seat:nth-child(2n){animation-delay:-.11s}
@keyframes wig{from{transform:rotate(-1.7deg) translateY(-1px)}to{transform:rotate(1.7deg) translateY(1px)}}
.pop .seat{animation:pop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{transform:scale(.35) rotate(-7deg)}to{transform:none}}

/* ---------- stage ---------- */
#stage{display:flex;flex-direction:column;gap:12px;position:relative}
.note{align-self:center;font-size:.9rem;color:var(--ink-soft);border:2px dashed var(--ink-soft);
  border-radius:var(--wobA);padding:.1em .9em;text-align:center}
.actions,.subacts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.msg{min-height:1.6em;text-align:center;font-weight:700;color:var(--warn)}
.hanlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hancard{border:var(--line) solid var(--ink);border-radius:var(--wobC);padding:.35em .8em .5em;min-width:0}
.hancard:nth-child(2n){border-radius:var(--wobA)}
.hancard h3{font-family:var(--font-hand);font-weight:700;font-size:1.35rem;line-height:1.3}
.hancard ul{display:flex;flex-wrap:wrap;gap:0 .8em;font-weight:700}
.secret{position:absolute;right:0;bottom:-18px;font-size:.6rem;color:var(--ink-soft);opacity:.55;user-select:none}
#copyBox{width:100%;border:var(--line) solid var(--ink);border-radius:var(--wobA);padding:.5em;background:var(--paper)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.bang{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:21}
.bang span{font-family:var(--font-hand);font-weight:700;font-size:clamp(3.5rem,17vw,10rem);line-height:1;color:var(--ink);
  background:var(--sun);border:4px solid var(--ink);border-radius:46% 54% 48% 52%/55% 45% 55% 45%;
  padding:.25em .5em;box-shadow:0 8px 0 var(--ink);animation:bang 1s ease-out both}
@keyframes bang{0%{transform:scale(.2) rotate(-12deg);opacity:1}18%{transform:scale(1.12) rotate(3deg)}
  30%{transform:scale(1) rotate(-2deg)}75%{transform:scale(1) rotate(-2deg);opacity:1}100%{transform:scale(1.25);opacity:0}}

/* ---------- teacher's room ---------- */
#room{display:flex;flex-direction:column;gap:14px;border-top:var(--line) dashed var(--ink);padding-top:12px}
.roomttl{font-family:var(--font-hand);font-weight:700;font-size:1.6rem;line-height:1.2}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
#panel{display:flex;flex-direction:column;gap:14px;min-width:0}
#panel h2{font-family:var(--font-hand);font-weight:700;font-size:1.45rem;line-height:1.3}
#panel h3{font-size:1rem;font-weight:700}
.help{color:var(--ink-soft);max-width:38em}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stepper output{min-width:1.6em;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stepper .btn{padding:.1em .7em;font-size:1.2rem}
.brushes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brushes legend{font-weight:700;margin-bottom:6px}
.seat.edit{cursor:pointer}
.seat.edit.off{visibility:visible;background:transparent;border-style:dashed;color:var(--ink-soft)}
.seat.a-boy,.seat.boy{background:var(--soda)}
.seat.a-girl,.seat.girl{background:var(--coral)}
.seat.empty .nm{color:var(--ink-soft)}
.seat.sel{background:var(--sun);outline:4px solid var(--focus);outline-offset:1px}
.sum{font-weight:700}
.bad{color:var(--warn);font-weight:700}
.good{color:var(--good);font-weight:700}
.counts{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;border:var(--line) solid var(--ink);
  border-radius:var(--wobC);background:var(--wash);padding:.6em 1em .7em}
.counts h3{flex-basis:100%}
.counts label,.counts .total{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.counts input,.counts output{width:4.2em;text-align:center;font-size:1.35rem;font-weight:700;line-height:1.4;
  border:2px solid var(--ink);border-radius:var(--wobB);background:var(--paper);padding:.05em .2em;font-variant-numeric:tabular-nums}
.counts output{display:inline-block;background:var(--sun)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cols2>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.kidlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.kidlist li{display:flex;gap:4px;min-width:0}
.kidlist input,textarea,select{border:2px solid var(--ink);border-radius:var(--wobB);background:var(--paper);
  padding:.25em .6em;min-width:0;width:100%}
.kidlist .x,.rulelist .x{flex:none;border:2px solid var(--ink);border-radius:50%;width:2em;height:2em;
  background:var(--paper);font-weight:700;line-height:1}
.rulelist{display:flex;flex-direction:column;gap:6px}
.rulelist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:var(--wobA);padding:0 .6em;font-size:.9rem}
.pill.near{background:var(--mint)}.pill.far{background:var(--coral)}
.ruleform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.ruleform label{display:flex;flex-direction:column;gap:2px;font-weight:700;min-width:0}
.opt{display:flex;gap:.6em;align-items:flex-start;font-weight:700}
.opt input{width:1.3em;height:1.3em;flex:none;margin-top:.2em;accent-color:var(--board)}
.opt span span{display:block;font-weight:400;color:var(--ink-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.tray{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .grp{font-weight:700;min-width:3.5em}
.chip{border:2px solid var(--ink);border-radius:var(--wobA);padding:.1em .7em;font-weight:700}
.chip.boy{background:var(--soda)}.chip.girl{background:var(--coral)}
.chip[aria-pressed="true"]{background:var(--sun);outline:3px solid var(--focus);outline-offset:1px}
.warnlist{display:flex;flex-direction:column;gap:2px}
.small{font-size:.9rem;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
/*LOGIC-START*/
var Logic=(function(){
  function rc(i,cols){return [Math.floor(i/cols),i%cols];}
  function manhattan(a,b,cols){var p=rc(a,cols),q=rc(b,cols);return Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1]);}
  function cheb(a,b,cols){var p=rc(a,cols),q=rc(b,cols);return Math.max(Math.abs(p[0]-q[0]),Math.abs(p[1]-q[1]));}
  function fits(seat,kid){return !!seat&&seat.on&&(seat.attr==='any'||seat.attr===kid.sex);}
  function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // near = side by side or front/back. far = not touching (8 directions), and optionally not in the same group.
  function ruleBroken(rule,pos,cfg){
    var sa=pos[rule.a],sb=pos[rule.b];
    if(sa===undefined||sb===undefined)return false;
    if(rule.type==='near')return manhattan(sa,sb,cfg.cols)!==1;
    if(cheb(sa,sb,cfg.cols)<=1)return true;
    if(cfg.useHan&&cfg.sepHan){var ha=cfg.seats[sa].han,hb=cfg.seats[sb].han;if(ha>0&&ha===hb)return true;}
    return false;
  }
  function posOf(assign){var pos={};for(var s in assign)pos[assign[s]]=+s;return pos;}
  function brokenRules(assign,cfg){var pos=posOf(assign),out=[];cfg.rules.forEach(function(r,i){if(ruleBroken(r,pos,cfg))out.push(i);});return out;}
  function misfits(assign,cfg){
    var by={};cfg.kids.forEach(function(k){by[k.id]=k;});var out=[];
    for(var s in assign){var k=by[assign[s]];if(k&&!fits(cfg.seats[s],k))out.push(+s);}
    return out;
  }
  function count(cfg){
    var n={seats:0,sb:0,sg:0,sa:0,kids:cfg.kids.length,kb:0,kg:0};
    cfg.seats.forEach(function(s){if(!s.on)return;n.seats++;if(s.attr==='boy')n.sb++;else if(s.attr==='girl')n.sg++;else n.sa++;});
    cfg.kids.forEach(function(k){if(k.sex==='boy')n.kb++;else n.kg++;});
    return n;
  }
  function feasible(cfg){
    var n=count(cfg);
    if(n.kids===0)return 'nokids';
    if(n.kids>n.seats)return 'seats';
    if(Math.max(0,n.kb-n.sb)+Math.max(0,n.kg-n.sg)>n.sa)return 'sex';
    return '';
  }

  // Random placement by restarts + min-conflict swaps. `fixed` ({seat:kidId}) is never moved.
  function solve(cfg,fixed,rng,opt){
    rng=rng||Math.random;opt=opt||{};
    var restarts=opt.restarts||40,steps=opt.steps||5000;
    var by={};cfg.kids.forEach(function(k){by[k.id]=k;});
    var fix={},used={},s;
    if(fixed)for(s in fixed){var fk=fixed[s],fs=cfg.seats[s];if(fs&&fs.on&&by[fk]&&!used[fk]){fix[s]=fk;used[fk]=1;}}
    var F=[];cfg.seats.forEach(function(st,i){if(st.on&&fix[i]===undefined)F.push(i);});
    var freeKids=cfg.kids.filter(function(k){return !used[k.id];});
    if(freeKids.length>F.length)return {ok:false,reason:'seats'};
    var sB=F.filter(function(i){return cfg.seats[i].attr==='boy';}),
        sG=F.filter(function(i){return cfg.seats[i].attr==='girl';}),
        sA=F.filter(function(i){return cfg.seats[i].attr==='any';});
    var kB=freeKids.filter(function(k){return k.sex==='boy';}).map(function(k){return k.id;}),
        kG=freeKids.filter(function(k){return k.sex!=='boy';}).map(function(k){return k.id;});
    if(Math.max(0,kB.length-sB.length)+Math.max(0,kG.length-sG.length)>sA.length)return {ok:false,reason:'sex'};
    var best=null;
    for(var t=0;t<restarts;t++){
      var arr={};for(s in fix)arr[s]=fix[s];
      var b=shuffle(kB.slice(),rng),g=shuffle(kG.slice(),rng);
      var qB=shuffle(sB.slice(),rng),qG=shuffle(sG.slice(),rng),qA=shuffle(sA.slice(),rng),ai=0,i;
      for(i=0;i<b.length;i++)arr[i<qB.length?qB[i]:qA[ai++]]=b[i];
      for(i=0;i<g.length;i++)arr[i<qG.length?qG[i]:qA[ai++]]=g[i];
      var pos=posOf(arr);
      var doSwap=function(s1,s2){
        var k1=arr[s1],k2=arr[s2];
        if(k2===undefined)delete arr[s1];else{arr[s1]=k2;pos[k2]=s1;}
        if(k1===undefined)delete arr[s2];else{arr[s2]=k1;pos[k1]=s2;}
      };
      var trySwap=function(s1,s2){
        if(s1===s2)return false;
        var k1=arr[s1],k2=arr[s2];
        if(k1===undefined&&k2===undefined)return false;
        if(k1!==undefined&&!fits(cfg.seats[s2],by[k1]))return false;
        if(k2!==undefined&&!fits(cfg.seats[s1],by[k2]))return false;
        doSwap(s1,s2);return true;
      };
      var cost=function(){var c=0;for(var j=0;j<cfg.rules.length;j++)if(ruleBroken(cfg.rules[j],pos,cfg))c++;return c;};
      for(i=0;i<F.length*4;i++)trySwap(F[Math.floor(rng()*F.length)],F[Math.floor(rng()*F.length)]);
      var c=cost();
      for(i=0;i<steps&&c>0;i++){
        var bad=cfg.rules.filter(function(r){return ruleBroken(r,pos,cfg);});
        var r=bad[Math.floor(rng()*bad.length)];
        var mover=rng()<.5?r.a:r.b,other=mover===r.a?r.b:r.a;
        if(fix[pos[mover]]!==undefined){var tmp=mover;mover=other;other=tmp;}
        var s1=pos[mover];
        if(fix[s1]!==undefined)continue;
        var s2;
        if(r.type==='near'&&rng()<.7){
          var o=rc(pos[other],cfg.cols),cand=[];
          [[o[0]-1,o[1]],[o[0]+1,o[1]],[o[0],o[1]-1],[o[0],o[1]+1]].forEach(function(p){
            if(p[0]<0||p[0]>=cfg.rows||p[1]<0||p[1]>=cfg.cols)return;
            var q=p[0]*cfg.cols+p[1];
            if(cfg.seats[q].on&&fix[q]===undefined)cand.push(q);
          });
          if(!cand.length)continue;
          s2=cand[Math.floor(rng()*cand.length)];
        }else s2=F[Math.floor(rng()*F.length)];
        if(!trySwap(s1,s2))continue;
        var nc=cost();
        if(nc<=c||rng()<.03)c=nc;else doSwap(s1,s2);
      }
      c=cost();
      if(!best||c<best.cost){var copy={};for(s in arr)copy[s]=arr[s];best={ok:true,assign:copy,cost:c};}
      if(c===0)break;
    }
    best.bad=brokenRules(best.assign,cfg);
    return best;
  }

  // Cut the room into blocks of w columns x h rows; leftovers join the last block. Numbers run 1..n.
  function autoHan(rows,cols,seats,w,h){
    var nbc=Math.max(1,Math.floor(cols/w)),nbr=Math.max(1,Math.floor(rows/h)),raw=[],usedRaw={};
    for(var i=0;i<rows*cols;i++){
      var p=rc(i,cols),id=Math.min(nbr-1,Math.floor(p[0]/h))*nbc+Math.min(nbc-1,Math.floor(p[1]/w));
      raw.push(id);if(seats[i].on)usedRaw[id]=1;
    }
    var map={},n=0;Object.keys(usedRaw).map(Number).sort(function(a,b){return a-b;}).forEach(function(id){map[id]=++n;});
    seats.forEach(function(s,i){s.han=s.on?map[raw[i]]:0;});
    return n;
  }
  function nearestHan(i,seats,cols){
    var best=1,bd=1e9;
    seats.forEach(function(s,j){if(j===i||!s.on||!(s.han>0))return;var d=manhattan(i,j,cols);if(d<bd){bd=d;best=s.han;}});
    return best;
  }
  function resize(seats,oldCols,rows,cols){
    var oldRows=seats.length/oldCols,out=[];
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
      var o=(r<oldRows&&c<oldCols)?seats[r*oldCols+c]:null;
      out.push(o?{on:o.on,attr:o.attr,han:o.han}:{on:true,attr:'any',han:0});
    }
    return out;
  }
  return {rc:rc,manhattan:manhattan,cheb:cheb,fits:fits,shuffle:shuffle,brokenRules:brokenRules,misfits:misfits,
          count:count,feasible:feasible,solve:solve,autoHan:autoHan,nearestHan:nearestHan,resize:resize};
})();

var Snd={ctx:null,master:null,rollBus:null,noise:null,timer:null,
  init:function(){
    if(!S.sound)return;
    try{
      if(!this.ctx){
        var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        var c=this.ctx=new AC();
        this.master=c.createGain();this.master.gain.value=.9;
        var comp=c.createDynamicsCompressor();this.master.connect(comp);comp.connect(c.destination);
        this.rollBus=c.createGain();this.rollBus.connect(this.master);
        var b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
        for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
        this.noise=b;
      }
      if(this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){this.ctx=null;}
  },
  ok:function(){return S.sound&&this.ctx;},
  burst:function(t,vol,dur,hp,lp,out){
    var c=this.ctx,s=c.createBufferSource();s.buffer=this.noise;s.loop=true;
    var f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    var l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;
    var g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(l);l.connect(g);g.connect(out||this.master);
    s.start(t,Math.random()*.5);s.stop(t+dur+.03);
  },
  tone:function(t,type,f0,f1,vol,dur,out){
    var c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(out||this.master);o.start(t);o.stop(t+dur+.03);
  },
  startRoll:function(){
    if(!this.ok())return;
    this.stopRoll();
    var self=this,c=this.ctx,next=c.currentTime+.05,t0=next;
    this.rollBus.gain.cancelScheduledValues(c.currentTime);this.rollBus.gain.setValueAtTime(1,c.currentTime);
    this.timer=setInterval(function(){
      while(next<c.currentTime+.12){
        var swell=Math.min(1,.45+(next-t0)*.2),v=swell*(.17+Math.random()*.1);
        self.burst(next,v,.07,1200,7500,self.rollBus);
        self.tone(next,'triangle',215,150,v*.5,.05,self.rollBus);
        next+=.036+Math.random()*.008;
      }
    },30);
  },
  stopRoll:function(){
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    if(this.ctx&&this.rollBus)this.rollBus.gain.setTargetAtTime(0,this.ctx.currentTime,.008);
  },
  dedeen:function(){
    if(!this.ok())return;
    var t=this.ctx.currentTime+.03,self=this;
    this.tone(t,'sine',130,72,.9,.22);this.burst(t,.5,.1,80,900);
    var u=t+.19;
    this.tone(u,'sine',104,52,1,.6);this.burst(u,.6,.14,80,900);
    this.burst(u,.38,1.5,5200,14000);
    [392,523.25,659.25,783.99].forEach(function(f){self.tone(u,'triangle',f,f,.13,1.2);self.tone(u,'sawtooth',f/2,f/2,.035,.9);});
  },
  blip:function(){if(!this.ok())return;this.tone(this.ctx.currentTime+.01,'sine',620,880,.16,.09);}
};

function confetti(){

    countForm()+'<div class="cols2">'+kidCol('boy','だんし')+kidCol('girl','じょし')+'</div>'+countLine()+
    '<p class="small">なまえ は この たんまつ の ブラウザ の なか だけ に のこります。そと には おくりません。</p>'+
    '<div><button type="button" class="btn sm danger" data-act="wipe">'+(ui.wipe?'ほんとう に けす？ もういちど おす':'なまえ を ぜんぶ けす')+'</button></div>';
}
function kidOptions(){
  var grp=function(sex,label){
    return '<optgroup label="'+label+'">'+S.kids.filter(function(k){return k.sex===sex;}).map(function(k){
      return '<option value="'+k.id+'">'+esc(k.name)+'</option>';}).join('')+'</optgroup>';
  };
  return '<option value="">えらぶ</option>'+grp('boy','だんし')+grp('girl','じょし');
}
function ruleText(r){return nm(r.a)+' と '+nm(r.b);}
function pRules(){
  var rules=cfg().rules;
  return '<h2>なかよし・はなす</h2>'+
    '<p class="help">ふたり を えらんで、ちかく に する か、はなす か を きめます。じどう シャッフル の とき に まもります。</p>'+
    '<div class="ruleform">'+
      '<label>ひとりめ<select id="ruleA">'+kidOptions()+'</select></label>'+
      '<label>ふたりめ<select id="ruleB">'+kidOptions()+'</select></label>'+
      '<label>どうする<select id="ruleT"><option value="near">いっしょ に する（となり・まえ うしろ）</option>'+
        '<option value="far">はなす（となり や ちかく に しない）</option></select></label>'+
      '<div><button type="button" class="btn" data-act="addrule">たす</button></div>'+
    '</div>'+
    (ui.note?'<p class="bad">'+ui.note+'</p>':'')+
    (rules.length?'<ul class="rulelist">'+rules.map(function(r){
      return '<li><span class="pill '+r.type+'">'+(r.type==='near'?'いっしょ':'はなす')+'</span><span>'+esc(ruleText(r))+'</span>'+
        '<button type="button" class="x" data-act="delrule" data-a="'+r.a+'" data-b="'+r.b+'" aria-label="この じょうけん を けす">×</button></li>';
    }).join('')+'</ul>':'<p class="small">まだ じょうけん は ありません。</p>')+
    '<label class="opt"><input type="checkbox" id="sepHan" data-chg="sepHan"'+(S.sepHan?' checked':'')+'>'+
      '<span>はなす ふたり は おなじ はん に しない</span></label>';
}
function pHan(){
  var out='<h2>はん</h2>'+
    '<label class="opt"><input type="checkbox" id="useHan" data-chg="useHan"'+(S.useHan?' checked':'')+'><span>はん を つかう</span></label>';
  if(!S.useHan)return out+'<p class="small">はん の なまえ は ひょうじ されません。</p>';
  var m=maxHan(),sizes=[],h;
  for(h=1;h<=m;h++)sizes.push(0);
  var none=0;
  S.seats.forEach(function(s){if(!s.on)return;if(s.han>0)sizes[s.han-1]++;else none++;});
  var brush='';
  for(h=1;h<=m;h++)brush+='<button type="button" class="btn sm" data-act="hanbrush" data-h="'+h+'" aria-pressed="'+(ui.hanBrush===h)+'">'+h+'はん</button>';
  brush+='<button type="button" class="btn sm" data-act="hanbrush" data-h="'+(m+1)+'" aria-pressed="'+(ui.hanBrush===m+1)+'">あたらしい はん</button>'+
    '<button type="button" class="btn sm" data-act="hanbrush" data-h="0" aria-pressed="'+(ui.hanBrush===0)+'">はん なし</button>';
  var inner=seatOrder().map(function(i){
    var st=S.seats[i];if(!st.on)return OFF;
    return seatHTML('button',i,st.han>0?st.han+'はん':'なし','',' edit'+hcOf(st),'hanseat');
  }).join('');
  return out+
    '<p class="help">はん は せき の かたまり です。かたち を きめて つくった あと、せき を タップ して なおせます。</p>'+
    '<div class="row">'+stepper('1はん の よこ','hanW',S.hanW)+stepper('1はん の たて','hanH',S.hanH)+
      '<button type="button" class="btn sm" data-act="hanmake">この かたち で つくる</button></div>'+
    '<fieldset class="brushes"><legend>タップ した せき を この はん に する</legend>'+brush+'</fieldset>'+
    boardHTML(inner)+
    '<p class="sum">'+sizes.map(function(n,i){return (i+1)+'はん '+n+'せき';}).join('　')+(none?'　はん なし '+none+'せき':'')+'</p>';
}
function manualWarnings(){
  var c=cfg(),out=[];
  Logic.misfits(S.manual,c).forEach(function(s){
    out.push(nm(S.manual[s])+' が '+ATTR[S.seats[s].attr]+' の せき に います');
  });
  Logic.brokenRules(S.manual,c).forEach(function(i){
    var r=c.rules[i];
    out.push(r.type==='near'?ruleText(r)+' が となり では ありません（いっしょ）':ruleText(r)+' が ちかい です（はなす）');
  });
  return out;
}
function runCheck(){
  var c=cfg(),why=Logic.feasible(c);
  if(why)return '<p class="bad">'+MSG[why].split('。')[0]+'。</p>';
  var res=Logic.solve(c,S.mode==='A'?S.manual:null);
  if(!res.ok)return '<p class="bad">'+MSG[res.reason].split('。')[0]+'。</p>';
  if(res.cost===0)return '<p class="good">だいじょうぶ！ じょうけん は ぜんぶ まもれます。</p>';
  return '<p class="bad">まもれない じょうけん が あります。</p><ul class="warnlist">'+res.bad.map(function(i){
    var r=c.rules[i];return '<li>'+(r.type==='near'?'いっしょ':'はなす')+'： '+esc(ruleText(r))+'</li>';}).join('')+'</ul>';
}
function pMode(){
  var out='<h2>きめかた</h2><fieldset class="opts"><legend class="small">せきがえ の やりかた を えらびます。</legend>'+
    '<label class="opt"><input type="radio" name="mode" id="modeA" value="A" data-chg="mode"'+(S.mode==='A'?' checked':'')+'>'+
      '<span>せんせい けってい モード<span>せんせい が まえもって きめた せき を、ドラムロール の あと に はっぴょう します。</span></span></label>'+
    '<label class="opt"><input type="radio" name="mode" id="modeB" value="B" data-chg="mode"'+(S.mode==='B'?' checked':'')+'>'+
      '<span>じどう シャッフル モード<span>じょうけん を まもりながら、アプリ が くじびき で きめます。</span></span></label></fieldset>';
  if(S.mode==='A'){
    var placed={},s,cnt=0;for(s in S.manual){placed[S.manual[s]]=1;cnt++;}
    var rest=S.kids.filter(function(k){return !placed[k.id];});
    var chips=function(sex,label){
      var l=rest.filter(function(k){return k.sex===sex;});
      if(!l.length)return '';
      return '<div class="chips"><span class="grp">'+label+'</span>'+l.map(function(k){
        return '<button type="button" class="chip '+sex+'" data-act="pick" data-id="'+k.id+'" aria-pressed="'+(!!ui.sel&&ui.sel.kid===k.id)+'">'+esc(k.name)+'</button>';
      }).join('')+'</div>';
    };
    var inner=seatOrder().map(function(i){
      var st=S.seats[i];if(!st.on)return OFF;
      var k=S.manual[i]!==undefined?kid(S.manual[i]):null,tag=[];
      if(S.useHan&&st.han>0)tag.push(st.han+'はん');
      if(st.attr!=='any')tag.push(ATTR[st.attr]);
      return seatHTML('button',i,k?k.name:'あき',tag.join('・'),' edit'+hcOf(st)+(k?'':' empty')+(ui.sel&&ui.sel.seat===i?' sel':''),'mseat');
    }).join('');
    var warns=manualWarnings();
    out+='<h3>せき を きめる（きまった '+cnt+'にん ／ のこり '+rest.length+'にん）</h3>'+
      '<p class="help">なまえ を えらんでから、せき を タップ します。すわって いる ひと を タップ すると、うごかせます。きめて いない ひと は、ほんばん で じどう で はいります。</p>'+
      '<div class="tray">'+(rest.length?chips('boy','だんし')+chips('girl','じょし'):'<p class="good">ぜんいん きまりました。</p>')+'</div>'+
      boardHTML(inner)+
      '<div class="row"><button type="button" class="btn sm" data-act="fill">のこり を じどう で うめる</button>'+
        '<button type="button" class="btn sm" data-act="unplace">えらんだ ひと を はずす</button>'+
        '<button type="button" class="btn sm danger" data-act="clearmanual">ぜんぶ はずす</button></div>'+
      (ui.note?'<p class="bad">'+ui.note+'</p>':'')+
      (warns.length?'<ul class="warnlist bad">'+warns.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>':'');
  }
  out+='<h3>じょうけん の たしかめ</h3>'+
    '<div><button type="button" class="btn sm" data-act="check">じょうけん を たしかめる</button></div>'+(ui.check||'')+
    '<p class="small">せきがえ の がめん の みぎした に、ちいさな しるし が でます。★ せんせい けってい ／ ● じどう シャッフル ／ ▲ まもれなかった じょうけん あり。こども には モード の なまえ は みえません。</p>';
  return out;
}
function renderRoom(){
  $('#tabs').innerHTML=TABS.map(function(t){
    return '<button type="button" class="btn sm" data-act="tab" data-tab="'+t[0]+'" aria-pressed="'+(ui.tab===t[0])+'">'+t[1]+'</button>';
  }).join('');
  $('#panel').innerHTML={seats:pSeats,kids:pKids,rules:pRules,han:pHan,mode:pMode}[ui.tab]();
}
function render(){
  if($('#room').hidden)renderStage(false);else{renderRoom();renderTop();}
}

/* ---------- actions ---------- */
function setGrid(rows,cols){
  rows=Math.min(8,Math.max(1,rows));cols=Math.min(8,Math.max(1,cols));
  if(rows===S.rows&&cols===S.cols)return;
  var oldCols=S.cols,man={},s;
  for(s in S.manual){var p=Logic.rc(+s,oldCols);if(p[0]<rows&&p[1]<cols)man[p[0]*cols+p[1]]=S.manual[s];}
  S.seats=Logic.resize(S.seats,oldCols,rows,cols);S.rows=rows;S.cols=cols;S.manual=man;
  Logic.autoHan(rows,cols,S.seats,S.hanW,S.hanH);
  structural();
}
function brushSeat(i){
  var st=S.seats[i];
  if(ui.brush==='toggle'){
    st.on=!st.on;
    if(!st.on){st.han=0;delete S.manual[i];}
  }else{st.on=true;st.attr=ui.brush;}
  if(st.on&&!(st.han>0))st.han=Logic.nearestHan(i,S.seats,S.cols);
  normalizeHan();structural();
}
function addKids(sex){
  var box=$('#add-'+sex),added=0;
  box.value.split(/[\n,、]+/).forEach(function(line){
    var name=line.replace(/\s+/g,' ').trim().slice(0,12);
    if(!name||S.kids.length>=64)return;
    S.kids.push({id:'k'+(S.nextId++),name:name,sex:sex});added++;
  });
  if(added){S.isSample=false;structural();}
}
function setCount(sex,n){
  if(isNaN(n))return;
  var list=S.kids.filter(function(k){return k.sex===sex;}),other=S.kids.length-list.length;
  n=Math.max(0,Math.min(40,n,64-other));
  if(n===list.length)return;
  var label=sex==='boy'?'だんし':'じょし',i;
  if(n>list.length){
    var names={},num=list.length;S.kids.forEach(function(k){names[k.name]=1;});
    while(list.length<n){
      do{num++;}while(names[label+num]);
      var k={id:'k'+(S.nextId++),name:label+num,sex:sex};names[k.name]=1;S.kids.push(k);list.push(k);
    }
  }else{
    var re=new RegExp('^'+label+'[0-9]+$'),drop=list.length-n,ids={};
    for(i=list.length-1;i>=0&&drop>0;i--)if(re.test(list[i].name)){ids[list[i].id]=1;drop--;}
    for(i=list.length-1;i>=0&&drop>0;i--)if(!ids[list[i].id]){ids[list[i].id]=1;drop--;}
    S.kids=S.kids.filter(function(k){return !ids[k.id];});
  }
  S.isSample=false;cleanUp();structural();
}
function addRule(){
  var a=$('#ruleA').value,b=$('#ruleB').value,t=$('#ruleT').value;
  ui.note='';
  if(!a||!b||a===b){ui.note='ちがう ふたり を えらんでね。';return;}
  S.rules=S.rules.filter(function(r){return !((r.a===a&&r.b===b)||(r.a===b&&r.b===a));});
  S.rules.push({a:a,b:b,type:t});ui.check='';
}
function manualSeat(i){
  var sel=ui.sel,s;
  if(sel&&sel.kid){
    for(s in S.manual)if(S.manual[s]===sel.kid)delete S.manual[s];
    S.manual[i]=sel.kid;ui.sel=null;
  }else if(sel&&sel.seat!==undefined){
    if(sel.seat!==i){
      var k1=S.manual[sel.seat],k2=S.manual[i];
      if(k2===undefined)delete S.manual[sel.seat];else S.manual[sel.seat]=k2;
      S.manual[i]=k1;
    }
    ui.sel=null;
  }else if(S.manual[i]!==undefined){ui.sel={seat:i};}
  ui.check='';
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');
  if(!el)return;
  var act=el.dataset.act,d=el.dataset;
  if(act!=='wipe')ui.wipe=false;
  if(act!=='addrule'&&act!=='fill')ui.note='';
  switch(act){
    case 'go':go();return;
    case 'reset':stopRolling();S.result=null;ui.phase='idle';stageMsg('');break;
    case 'copy':copyResult();return;
    case 'sound':S.sound=!S.sound;if(S.sound){Snd.init();Snd.blip();}else Snd.stopRoll();break;
    case 'flip':S.flip=!S.flip;
      if(ui.phase==='rolling'){stopRolling();ui.phase='idle';ui.pending=null;}
      break;
    case 'teacher':
      if(ui.phase==='rolling'){stopRolling();ui.phase='idle';ui.pending=null;}
      $('#room').hidden=!$('#room').hidden;$('#stage').hidden=!$('#room').hidden;
      ui.sel=null;stageMsg('');window.scrollTo(0,0);break;
    case 'tab':ui.tab=d.tab;ui.sel=null;break;
    case 'step':
      var v=+d.d;
      if(d.k==='cols')setGrid(S.rows,S.cols+v);
      else if(d.k==='rows')setGrid(S.rows+v,S.cols);
      else S[d.k]=Math.min(4,Math.max(1,S[d.k]+v));
      break;
    case 'brush':ui.brush=d.b;break;
    case 'seat':brushSeat(+d.i);break;
    case 'addkids':addKids(d.sex);break;
    case 'delkid':
      S.kids=S.kids.filter(function(k){return k.id!==d.id;});S.isSample=false;cleanUp();structural();break;
    case 'wipe':
      if(!ui.wipe){ui.wipe=true;}
      else{ui.wipe=false;S.kids=[];S.rules=[];S.manual={};S.isSample=false;structural();}
      break;
    case 'addrule':addRule();break;
    case 'delrule':
      S.rules=S.rules.filter(function(r){return !(r.a===d.a&&r.b===d.b);});ui.check='';break;
    case 'hanmake':Logic.autoHan(S.rows,S.cols,S.seats,S.hanW,S.hanH);ui.hanBrush=1;ui.check='';break;
    case 'hanbrush':ui.hanBrush=+d.h;break;
    case 'hanseat':S.seats[+d.i].han=ui.hanBrush;normalizeHan();ui.hanBrush=Math.min(ui.hanBrush,maxHan()+1);ui.check='';break;
    case 'pick':ui.sel=(ui.sel&&ui.sel.kid===d.id)?null:{kid:d.id};break;
    case 'mseat':manualSeat(+d.i);break;
    case 'unplace':if(ui.sel&&ui.sel.seat!==undefined){delete S.manual[ui.sel.seat];ui.sel=null;ui.check='';}break;
    case 'clearmanual':S.manual={};ui.sel=null;ui.check='';break;
    case 'fill':
      var c=cfg(),why=Logic.feasible(c),res=why?null:Logic.solve(c,S.manual);
      if(why||!res.ok)ui.note=MSG[why||res.reason].split('。')[0]+'。';
      else{S.manual=res.assign;ui.sel=null;ui.note='';ui.check='';}
      break;
    case 'check':ui.check=runCheck();break;
  }
  save();render();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.kid){
    var k=kid(el.dataset.kid),v=el.value.replace(/\s+/g,' ').trim().slice(0,12);
    if(k&&v){k.name=v;S.isSample=false;}else if(k){el.value=k.name;}
    save();return;
  }
  if(el.dataset&&el.dataset.cnt){setCount(el.dataset.cnt,parseInt(el.value,10));save();render();return;}
  var chg=el.dataset&&el.dataset.chg;
  if(!chg)return;
  if(chg==='mode'){S.mode=el.value;ui.sel=null;}
  else S[chg]=el.checked;
  ui.check='';save();render();
});

render();
})();
</script>
</body>
</html>
